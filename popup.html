<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto Flow Veo</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body class="theme-futuristic">
  <div class="container">
    <!-- Header -->
    <div class="header">
      <h1 class="title">Auto Flow Veo</h1>
      <div class="header-controls">
        <button id="langToggle" class="lang-toggle">EN</button>
      </div>
    </div>

    <!-- Prompt Input Section -->
    <div class="section">
      <label for="promptInput" data-i18n="promptLabel">Danh sách Prompt (mỗi dòng một prompt):</label>
      <textarea 
        id="promptInput" 
        class="prompt-input" 
        rows="8" 
        data-i18n="promptPlaceholder"
        placeholder="Nhập hoặc dán danh sách prompt của bạn..."
      ></textarea>
      <div class="input-actions">
        <button id="importBtn" class="btn-glass btn-glass-secondary ripple" data-i18n="importBtn">
          <span class="icon">📁</span>
          Import từ file .txt
        </button>
        <input type="file" id="fileInput" accept=".txt" style="display: none;">
      </div>
    </div>

    <!-- Type Selection -->
    <div class="section">
      <label data-i18n="typeLabel">Chọn loại tạo:</label>
      <div class="type-buttons">
        <button id="imageBtn" class="btn-glass btn-glass-secondary btn-type ripple" data-type="image" data-i18n="imageBtn">
          <span class="icon">🖼️</span>
          Image
        </button>
        <button id="videoBtn" class="btn-glass btn-glass-secondary btn-type ripple" data-type="video" data-i18n="videoBtn">
          <span class="icon">🎬</span>
          Video
        </button>
      </div>
      <div id="selectedType" class="selected-type" style="display: none;"></div>
    </div>

    <!-- Settings Section -->
    <div class="section settings-section">
      <div class="settings-header">
        <label data-i18n="settingsLabel">Cài đặt:</label>
        <button id="toggleSettings" class="toggle-btn">▼</button>
      </div>
      <div id="settingsContent" class="settings-content" style="display: none;">
        <div class="setting-item">
          <label for="repeatCount" data-i18n="repeatLabel">Số lần lặp lại mỗi prompt:</label>
          <input type="number" id="repeatCount" min="1" max="10" value="1" class="setting-input">
        </div>
        <div class="setting-item">
          <label for="startIndex" data-i18n="startIndexLabel">Bắt đầu từ prompt số:</label>
          <input type="number" id="startIndex" min="1" value="1" class="setting-input">
        </div>
          <div class="setting-item">
            <label for="delayMin" data-i18n="delayMinLabel">Delay tối thiểu (giây):</label>
            <input type="number" id="delayMin" min="5" value="10" class="setting-input">
          </div>
          <div class="setting-item">
            <label for="delayMax" data-i18n="delayMaxLabel">Delay tối đa (giây):</label>
            <input type="number" id="delayMax" min="10" value="15" class="setting-input">
          </div>
          <div class="setting-item">
            <label for="characterDescription" data-i18n="characterLabel">Mô tả nhân vật (để giữ consistency):</label>
            <textarea id="characterDescription" rows="2" class="setting-input" placeholder="Ví dụ: A distinguished European man named Arthur, 70 years old, white hair, friendly face"></textarea>
            <small style="color: var(--color-text-secondary); font-size: 0.85em;">Mô tả này sẽ được thêm vào mọi prompt để giữ nhân vật đồng nhất</small>
          </div>
          <div class="setting-item">
            <label for="sceneDescription" data-i18n="sceneLabel">Mô tả cảnh (để giữ consistency):</label>
            <textarea id="sceneDescription" rows="2" class="setting-input" placeholder="Ví dụ: Modern smart home environment, warm lighting, contemporary furniture"></textarea>
            <small style="color: var(--color-text-secondary); font-size: 0.85em;">Mô tả này sẽ được thêm vào mọi prompt để giữ cảnh đồng nhất</small>
          </div>
      </div>
    </div>

    <!-- Control Buttons -->
    <div class="section">
      <div class="control-buttons">
        <button id="startBtn" class="btn-glass btn-glass-primary ripple" disabled data-i18n="startBtn">
          <span class="icon">▶️</span>
          Bắt đầu
        </button>
        <button id="pauseBtn" class="btn-glass btn-glass-secondary ripple" disabled style="display: none;" data-i18n="pauseBtn">
          <span class="icon">⏸️</span>
          Tạm dừng
        </button>
        <button id="resumeBtn" class="btn-glass btn-glass-primary ripple" disabled style="display: none;" data-i18n="resumeBtn">
          <span class="icon">▶️</span>
          Tiếp tục
        </button>
        <button id="stopBtn" class="btn-glass btn-glass-destructive ripple" disabled style="display: none;" data-i18n="stopBtn">
          <span class="icon">⏹️</span>
          Dừng
        </button>
      </div>
    </div>

    <!-- Progress Section -->
    <div class="section">
      <div class="progress-info">
        <div class="progress-text">
          <span data-i18n="progressLabel">Tiến trình:</span>
          <span id="progressText">0 / 0</span>
          <span id="progressPercent">(0%)</span>
        </div>
        <div class="progress-bar-container">
          <div id="progressBar" class="progress-bar"></div>
        </div>
      </div>
    </div>

    <!-- Log Section -->
    <div class="section">
      <div class="log-header">
        <label data-i18n="logLabel">Log:</label>
        <button id="clearLogBtn" class="btn-glass btn-glass-secondary btn-glass-sm ripple" data-i18n="clearLogBtn">
          <span class="icon">🗑️</span>
          Xóa log
        </button>
      </div>
      <div id="logArea" class="log-area"></div>
    </div>

    <!-- Status Message -->
    <div id="statusMessage" class="status-message" style="display: none;"></div>
  </div>

  <!-- Toast Container -->
  <div id="toastContainer" class="toast-container"></div>

  <script src="i18n.js"></script>
  <script src="settings.js"></script>
  <script src="utils.js"></script>
  <script src="loading-utils.js"></script>
  <script src="empty-states.js"></script>
  <script src="button-effects.js"></script>
  <script src="popup.js"></script>
</body>
</html>
